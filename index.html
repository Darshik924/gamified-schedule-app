<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="./src/dist/output.css" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gamified-Schedule-app</title>
  </head>
  <body class="bg-[#1a1428] text-[hsl(210_40%_96%)] font-sans">
    <nav
      class="w-full px-10 py-5 bg-[linear-linear(to_right,hsl(260_30%_8%),hsl(260_35%_12%))] border-b border-[hsl(260_25%_20%)] flex items-center justify-between"
    >
      <div class="flex items-center gap-4 hover:cursor-pointer">
        <div class="text-[#ffd700] text-2xl">🏆</div>
        <h1 class="text-2xl font-semibold tracking-wide">
          <span class="text-[#8b5cf6]">Quest</span>
          <span class="text-[#ffd700]">Board</span>
        </h1>
      </div>

      <div class="flex items-center gap-4">
        <div
          class="w-12 h-12 rounded-full border-2 border-[#8b5cf6] p-0.5 bg-linear-to-r from-[#3b82f6] to-[#8b5cf6]"
        >
          <div
            class="w-full h-full rounded-full bg-[hsl(260_25%_12%)] flex items-center justify-center text-sm"
          >
            👤
          </div>
        </div>

        <div class="flex flex-col">
          <span class="font-semibold">Epic Quester</span>
          <span class="text-md font-bold text-[hsl(210_20%_70%)]">Level 7</span>
        </div>
      </div>

      <div class="flex items-center gap-10">
        <div class="flex flex-col min-w-35">
          <div
            class="flex items-center gap-2 text-md font-bold text-[hsl(210_20%_70%)]"
          >
            ❤️ <span>Health</span>
          </div>

          <div
            class="w-full h-2 bg-[hsl(260_25%_20%)] rounded-full overflow-hidden mt-1"
          >
            <div
              class="h-full rounded-full"
              style="
                width: 85%;
                background: linear-linear(to right, #ef4444, #dc2626);
              "
            ></div>
          </div>

          <span class="text-xs mt-1 text-[hsl(210_20%_70%)]"> 85 / 100 </span>
        </div>

        <div class="flex flex-col min-w-40">
          <div
            class="flex items-center gap-2 text-md font-bold text-[hsl(210_20%_70%)]"
          >
            ⚡ <span>XP</span>
          </div>

          <div
            class="w-full h-2 bg-[hsl(260_25%_20%)] rounded-full overflow-hidden mt-1"
          >
            <div
              class="h-full rounded-full"
              style="
                width: 65%;
                background: linear-linear(to right, #3b82f6, #8b5cf6);
              "
            ></div>
          </div>

          <span class="text-xs mt-1 text-[hsl(210_20%_70%)]"> 650 / 1000 </span>
        </div>

        <div
          class="flex items-center gap-2 bg-[hsl(260_25%_12%)] border border-[hsl(260_25%_20%)] px-5 py-2 rounded-xl hover:border-[#ffd700] transition"
        >
          <span class="text-[#ffd700] text-lg">🪙</span>
          <span class="font-bold text-[#ffd700]"> 2450 </span>
        </div>
      </div>
    </nav>

    <section class="px-10 mt-12">
      <div class="flex items-center gap-4 mb-8">
        <div class="text-3xl text-[#06b6d4]">📊</div>
        <h2 class="text-3xl font-semibold tracking-wide">
          Your <span class="text-[#8b5cf6]">Progress</span>
        </h2>
      </div>

      <div class="grid grid-cols-3 gap-8">
        <div
          class="bg-[hsl(260_25%_12%)] border border-[hsl(260_25%_20%)] rounded-2xl p-6 hover:shadow-[0_0_25px_rgba(139,92,246,0.15)] transition duration-300"
        >
          <div class="flex items-center gap-4 mb-4">
            <div
              class="w-12 h-12 rounded-xl bg-linear-to-br from-[#06b6d4] to-[#8b5cf6] flex items-center justify-center text-xl"
            >
              ⚡
            </div>
            <span class="text-[hsl(210_20%_70%)] text-2xl"> Active Tasks </span>
          </div>

          <h3 class="text-4xl font-bold text-[#8b5cf6]">6</h3>
        </div>

        <div
          class="bg-[hsl(260_25%_12%)] border border-[hsl(260_25%_20%)] rounded-2xl p-6 hover:shadow-[0_0_25px_rgba(6,182,212,0.15)] transition duration-300"
        >
          <div class="flex items-center gap-4 mb-4">
            <div
              class="w-12 h-12 rounded-xl bg-linear-to-br from-[#06b6d4] to-[#ffd700] flex items-center justify-center text-xl"
            >
              🎯
            </div>
            <span class="text-[hsl(210_20%_70%)] text-2xl">
              Completed Today
            </span>
          </div>

          <h3 class="text-4xl font-bold text-[#06b6d4]">1</h3>
        </div>

        <div
          class="bg-[hsl(260_25%_12%)] border border-[hsl(260_25%_20%)] rounded-2xl p-6 hover:shadow-[0_0_25px_rgba(255,215,0,0.15)] transition duration-300"
        >
          <div class="flex items-center gap-4 mb-4">
            <div
              class="w-12 h-12 rounded-xl bg-linear-to-br from-[#ffd700] to-[#8b5cf6] flex items-center justify-center text-xl"
            >
              🔥
            </div>
            <span class="text-[hsl(210_20%_70%)] text-2xl">
              Current Streak
            </span>
          </div>

          <h3 class="text-4xl font-bold text-[#ffd700]">
            12 <span class="text-lg text-[hsl(210_20%_70%)]">days</span>
          </h3>
        </div>

        <div
          class="bg-[hsl(260_25%_12%)] border border-[hsl(260_25%_20%)] rounded-2xl p-6 hover:shadow-[0_0_25px_rgba(139,92,246,0.15)] transition duration-300"
        >
          <div class="flex items-center gap-4 mb-4">
            <div
              class="w-12 h-12 rounded-xl bg-linear-to-br from-[#8b5cf6] to-[#06b6d4] flex items-center justify-center text-xl"
            >
              🏆
            </div>
            <span class="text-[hsl(210_20%_70%)] text-2xl"> Best Streak </span>
          </div>

          <h3 class="text-4xl font-bold text-[#8b5cf6]">
            24 <span class="text-lg text-[hsl(210_20%_70%)]">days</span>
          </h3>
        </div>

        <div
          class="bg-[hsl(260_25%_12%)] border border-[hsl(260_25%_20%)] rounded-2xl p-6 hover:shadow-[0_0_25px_rgba(6,182,212,0.15)] transition duration-300"
        >
          <div class="flex items-center gap-4 mb-4">
            <div
              class="w-12 h-12 rounded-xl bg-linear-to-br from-[#06b6d4] to-[#8b5cf6] flex items-center justify-center text-xl"
            >
              🧠
            </div>
            <span class="text-[hsl(210_20%_70%)] text-2xl">
              Total Completed
            </span>
          </div>

          <h3 class="text-4xl font-bold text-[#06b6d4]">47</h3>
        </div>

        <!-- Achievements -->
        <div
          class="bg-[hsl(260_25%_12%)] border border-[hsl(260_25%_20%)] rounded-2xl p-6 hover:shadow-[0_0_25px_rgba(255,215,0,0.15)] transition duration-300"
        >
          <div class="flex items-center gap-4 mb-4">
            <div
              class="w-12 h-12 rounded-xl bg-linear-to-br from-[#ffd700] to-[#06b6d4] flex items-center justify-center text-xl"
            >
              🏅
            </div>
            <span class="text-[hsl(210_20%_70%)] text-2xl"> Achievements </span>
          </div>

          <h3 class="text-4xl font-bold text-[#ffd700]">8</h3>
        </div>
      </div>
    </section>

    <script type="module" src="./src/js/app.js"></script>
  </body>
</html>
