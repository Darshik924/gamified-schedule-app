<!-- Quest Card -->
<div
  class="relative bg-[hsl(260_25%_14%)] border border-[hsl(260_25%_22%)] rounded-2xl p-6 shadow-md hover:shadow-[0_0_25px_rgba(59,130,246,0.15)] transition duration-300"
>
  <!-- Left Accent Border -->
  <div
    class="absolute left-0 top-0 h-full w-1.5 rounded-l-2xl bg-gradient-to-b from-blue-400 to-blue-600"
  ></div>

  <!-- Top Section -->
  <div class="flex justify-between items-start">
    <div>
      <h4 class="text-xl font-semibold text-[hsl(210_40%_96%)]">
        Design database schema
      </h4>

      <p class="text-sm mt-2 text-[hsl(210_20%_70%)]">
        Create tables for users and tasks
      </p>
    </div>

    <!-- Priority Badge -->
    <span
      class="px-3 py-1 text-sm rounded-lg bg-orange-500 text-white font-medium"
    >
      High
    </span>
  </div>

  <!-- Divider -->
  <div class="border-t border-[hsl(260_25%_22%)] my-4"></div>

  <!-- Bottom Section -->
  <div class="flex items-center justify-between text-sm">
    <!-- XP + Coins + Time -->
    <div class="flex items-center gap-6">
      <!-- XP -->
      <div class="flex items-center gap-1 text-[#8b5cf6] font-medium">
        ⚡ <span>+150 XP</span>
      </div>

      <!-- Coins -->
      <div class="flex items-center gap-1 text-[#ffd700] font-medium">
        🪙 <span>+50</span>
      </div>

      <!-- Time -->
      <div class="flex items-center gap-1 text-[hsl(210_20%_70%)]">
        🕒 <span>2 days</span>
      </div>
    </div>

    <!-- Flag Icon -->
    <div
      class="text-[hsl(210_20%_60%)] hover:text-[#ffd700] cursor-pointer transition"
    >
      🚩
    </div>
  </div>
</div>
