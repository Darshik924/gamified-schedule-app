    <title>Character UI - Tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom radial gradient for that deep purple "void" look */
        .bg-void {
            background: radial-gradient(circle, #2a1b3d 0%, #0d0616 100%);
        }
    </style>
</head>

<body

                </div>
            </div>

            <div class="flex flex-col justify-center space-y-4 z-10">

                        Name:

                </div>

                <div class="space-y-4">
                    <div class="flex items-center gap-2">
                        <span class="text-xl">🪙</span>
                        <p id="cost" class="text-2xl font-mono font-bold text-amber-400">

                    </div>

                        <span class=" purchase relative flex items-center gap-2">
                            PURCHASE
                        </span>
                    </button>
                </div>
            </div>

            <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-amber-600/10 blur-[100px]"></div>
        </section>
